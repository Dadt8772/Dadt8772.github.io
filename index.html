<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>标签练习</title>
</head>
<body>
    <h1>HTML标签练习</h1>
    <p>这是段落。<strong>文字加粗</strong>,<em>文字斜体</em></p>
    <h2>水果列表</h2>
    <ul>
        <li>苹果</li>
        <li>芒果</li>
    </ul>
    <a href="https://www.baidu.com" target="_blank">点击访问百度</a>
</body>
<marquee>✨欢迎来到我的网页！文字会自动左右滚动✨</marquee>
<marquee direction="up">这段文字向上滚动</marquee>
<button onclick="alert('你点击了按钮！🎉')">点我试试</button>
<p>请输入你的名字：</p>
<input type="text" placeholder="在这里输入文字">
<p>你喜欢什么水果？</p>
<input type="checkbox">苹果
<input type="checkbox">香蕉

<p>选择性别：</p>
<input type="radio" name="sex">男
<input type="radio" name="sex">女
<p>选择城市：</p>
<select>
    <option>蒙自</option>
    <option>昆明</option>
    <option>大理</option>
</select>
<!-- controls 显示播放控件 -->
<audio controls>
    <source src="test.mp3" type="audio/mpeg">
    你的浏览器不支持音频

    <video controls width="400">
    <source src="test.mp4" type="video/mp4">
</video>
</html>
